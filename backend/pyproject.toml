[project]
name = "mustdo-backend"
version = "0.1.0"
description = "FastAPI backend for Mustdo"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "imageio-ffmpeg>=0.6.0",
    "itsdangerous>=2.2.0",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.9",
    "sqladmin>=0.31.0",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.30.0",
    "websockets>=12.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
